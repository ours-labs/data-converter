name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - if: runner.os == 'Windows'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features custom-protocol
      - if: runner.os == 'Windows'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --features custom-protocol -- -D warnings
      - if: runner.os == 'Windows'
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --features custom-protocol
