[package]
name = "pgcsv"
default-run = "pgcsv"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "SSH PostgreSQL CSV export foundation"

[dependencies]
base64 = "0.22"
csv = "1.3"
encoding_rs = "0.8"
ctrlc = "3.4"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "macros"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
futures-util = "0.3"
bytes = "1"

fs2 = "0.4"
keyring = { version = "3", features = ["windows-native"] }
rpassword = "7"
semver = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = "thin"
